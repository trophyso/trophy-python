[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trophy"
version = "1.32.0"
description = "A Python library for Trophy, the 1:1 customer engagement platform for consumer web and mobile apps"
keywords = ["trophy", "customer-engagement", "lifecycle-marketing", "personalization", "gamification", "api", "sdk"]
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "requests",
    "httpx",
    "httpcore>=1.0.9",
    "pydantic",
    "typing",
    "dataclasses",
    "typing_extensions",
]

[project.urls]
Homepage = "https://github.com/trophyso/trophy-python"
Repository = "https://github.com/trophyso/trophy-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["trophy", "trophy.*"]
